<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Multiprodutos Réguas Técnico | Anhanguera</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--primary:#1e3a5f;--bg:#f4f6fa;--card:#fff;--border:#dee2e8;--text:#1a2337;--muted:#6c757d;
  --email:#4361ee;--wa:#25d366;--sms:#f4a261;--wp:#e63946;--teal:#0096b2;--green:#2a9d8f;--amber:#c9a227}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text)}
#err{display:none;position:fixed;top:0;left:0;right:0;padding:12px 20px;background:#c00;color:#fff;font-size:.85rem;z-index:9999}
.hdr{background:var(--primary);color:#fff;padding:13px 24px;display:flex;align-items:center;gap:14px}
.hdr img{height:34px}.hdiv{width:1px;height:30px;background:rgba(255,255,255,.25)}
.hdr h1{font-size:1.05rem;font-weight:700}.sub{font-size:.73rem;opacity:.65;margin-top:2px}
.layout{display:flex;flex-direction:column;min-height:calc(100vh - 62px)}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.main{flex:1;padding:20px 24px;overflow-x:auto}
/* modal trigger */
.reg-btn{display:flex;align-items:center;gap:8px;background:var(--primary);color:#fff;border:none;border-radius:7px;padding:8px 16px;font-size:.83rem;font-weight:600;cursor:pointer;transition:opacity .15s}
.reg-btn:hover{opacity:.88}
.reg-count{background:rgba(255,255,255,.22);border-radius:4px;padding:1px 7px;font-size:.75rem;font-weight:700}
.reg-names{font-size:.78rem;color:var(--muted);max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* modal */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center}
.modal-ov.open{display:flex}
.modal{background:#fff;border-radius:12px;width:min(680px,95vw);max-height:85vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.18)}
.modal-hdr{padding:16px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-hdr h3{font-size:.95rem;font-weight:700;color:var(--primary)}
.modal-close{background:none;border:none;font-size:1.3rem;color:var(--muted);cursor:pointer;line-height:1;padding:0 4px}
.modal-close:hover{color:var(--text)}
.modal-acts{padding:8px 20px;border-bottom:1px solid var(--border);display:flex;gap:8px}
.modal-acts button{background:none;border:1px solid var(--border);border-radius:5px;padding:4px 12px;font-size:.77rem;font-weight:600;color:var(--primary);cursor:pointer}
.modal-acts button:hover{background:var(--bg)}
.modal-list{overflow-y:auto;padding:8px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px}
.mitem{display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;transition:background .1s}
.mitem:hover{background:var(--bg)}
.mitem input[type=checkbox]{margin-top:2px;accent-color:var(--teal);width:15px;height:15px;flex-shrink:0;cursor:pointer}
.mitem-info{flex:1;min-width:0}
.mitem-name{font-size:.8rem;font-weight:600;line-height:1.2}
.mitem-id{font-size:.67rem;color:var(--muted)}
.modal-ftr{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.btn-confirm{background:var(--teal);color:#fff;border:none;border-radius:7px;padding:8px 22px;font-size:.83rem;font-weight:700;cursor:pointer}
.btn-confirm:hover{opacity:.88}
.btn-cancel{background:none;border:1px solid var(--border);border-radius:7px;padding:8px 16px;font-size:.83rem;color:var(--muted);cursor:pointer}
/* tags sidebar removed, keep for modal compat */
.stag{border-radius:3px;padding:1px 6px;font-size:.64rem;font-weight:700;display:inline-block}
.sta{background:#d4edda;color:#1a6b35}.stp{background:#fff3cd;color:#7d5a00}.stf{background:#e8f4ff;color:#1a5fa0}
.psel{margin-bottom:18px}
.mtabs{display:flex;background:#fff;border:1px solid var(--border);border-radius:7px;width:fit-content;overflow:hidden;margin-bottom:10px}
.mtab{padding:6px 18px;border:none;cursor:pointer;font-size:.81rem;font-weight:600;background:transparent;color:var(--muted)}
.mtab.active{background:var(--primary);color:#fff}
.popts{display:flex;gap:10px;flex-wrap:wrap}
.pgrp{background:#fff;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.pghdr{background:#f0f2f7;padding:3px 12px;font-size:.67rem;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.pgbtns{display:flex}
.pbtn{padding:7px 13px;border:none;cursor:pointer;font-size:.8rem;background:transparent;color:var(--muted);font-weight:500;border-top:2px solid transparent}
.pbtn:hover{background:var(--bg);color:var(--text)}.pbtn.active{color:var(--primary);font-weight:700;border-top-color:var(--primary);background:#f0f5ff}
.krow{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border-radius:9px;padding:14px 15px;border:1px solid var(--border);position:relative;overflow:hidden}
.kpi:before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:#e63946}
.kpi.c1:before{background:var(--teal)}.kpi.c2:before{background:var(--green)}.kpi.c3:before{background:var(--amber)}
.klbl{font-size:.67rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.kval{font-size:1.5rem;font-weight:700;line-height:1.1}.ksub{font-size:.71rem;color:var(--muted);margin-top:3px}
.sec{font-size:.8rem;font-weight:700;color:var(--primary);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.sec:after{content:'';flex:1;height:1px;background:var(--border)}
.tw{background:var(--card);border-radius:9px;border:1px solid var(--border);overflow:hidden;margin-bottom:18px}
table{width:100%;border-collapse:collapse;font-size:.81rem}
thead th{background:#f8f9fc;padding:8px 12px;text-align:left;font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--border)}
tbody td{padding:8px 12px;border-bottom:1px solid #f0f2f5}
tbody tr:last-child td{border-bottom:none}tbody tr:hover td{background:#f8fafc}
.ct{display:inline-flex;align-items:center;gap:5px;border-radius:4px;padding:2px 7px;font-size:.7rem;font-weight:700}
.cte{background:#dde8ff;color:#2b45c8}.ctw{background:#d1f5e0;color:#1a6b35}
.cts{background:#fde8d5;color:#9a4010}.ctp{background:#fde8e8;color:#a02020}
.cdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
.mth{background:#f0f3fa!important;font-weight:700!important;color:var(--primary)!important;font-size:.73rem!important}
.crow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.ccard{background:var(--card);border-radius:9px;border:1px solid var(--border);padding:15px}
.ccard h4{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.warn{background:#fff8e1;border:1px solid #f0c040;border-radius:7px;padding:8px 13px;font-size:.79rem;color:#7d5a00;margin-bottom:13px}
.nd{color:var(--muted);font-style:italic;font-size:.82rem}
.fbadge{display:inline-block;background:#e8f4ff;color:#1a5fa0;border-radius:4px;padding:2px 8px;font-size:.7rem;font-weight:600;margin-left:6px;vertical-align:middle}
@media(max-width:768px){.layout{flex-direction:column}.sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border)}.crow{grid-template-columns:1fr}.main{padding:14px}}
</style>
</head>

var CC = {email:'#4361ee',wa:'#25d366',sms:'#f4a261',webpush:'#e63946'};

/* ── estado ── */
var selRegs = [], tempRegs = [], selPer = 'JUL', mode = 'mensal';

/* ── formatadores ── */
function fmt(n) { return n == null ? '\u2014' : Number(n).toLocaleString('pt-BR'); }
function pct(n) { return n == null ? '\u2014' : Number(n).toFixed(2) + '%'; }
function brl(n) { return n == null ? '\u2014' : 'R$\u00a0' + Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }

/* ── init ── */
window.onload = function() {
  var m = DATA.meta;
  document.getElementById('hmeta').textContent =
    m.conta + ' · ' + m.segmento + ' · ' + m.total_reguas + ' réguas · Gerado em ' + m.gerado_em;
  buildModal();
  buildPeriods();
  selRegs = DATA.reguas.map(function(r){ return r.id; });
  updateTopbar();
  render();
};

/* ── modal ── */
function buildModal() {
  var list = document.getElementById('modal-list');
  list.innerHTML = '';
  for (var i = 0; i < DATA.reguas.length; i++) {
    var r = DATA.reguas[i];
    var inf = FUNIL[r.id] || {nome: r.nome_curto, funil: 'A mapear', status: 'ativo'};
    var item = document.createElement('label');
    item.className = 'mitem';
    item.innerHTML =
      '<input type="checkbox" value="' + r.id + '" checked> ' +
      '<div class="mitem-info">' +
        '<div class="mitem-name">' + inf.nome + '</div>' +
        '<div class="mitem-id">' + r.id + ' ' + stag(inf.status) + ' <span class="stag stf">' + inf.funil + '</span></div>' +
      '</div>';
    list.appendChild(item);
  }
  document.getElementById('open-modal').onclick = openModal;
  document.getElementById('modal-close').onclick = closeModal;
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-ov').onclick = function(e){ if(e.target===this) closeModal(); };
  document.getElementById('sel-all').onclick = function(){
    var cbs = document.querySelectorAll('#modal-list input[type=checkbox]');
    for(var i=0;i<cbs.length;i++) cbs[i].checked=true;
  };
  document.getElementById('sel-none').onclick = function(){
    var cbs = document.querySelectorAll('#modal-list input[type=checkbox]');
    for(var i=0;i<cbs.length;i++) cbs[i].checked=false;
  };
  document.getElementById('modal-confirm').onclick = function(){
    var cbs = document.querySelectorAll('#modal-list input[type=checkbox]');
    selRegs = [];
    for(var i=0;i<cbs.length;i++) if(cbs[i].checked) selRegs.push(cbs[i].value);
    if(!selRegs.length) { alert('Selecione ao menos uma régua.'); return; }
    closeModal();
    updateTopbar();
    render();
  };
}
function openModal() {
  var cbs = document.querySelectorAll('#modal-list input[type=checkbox]');
  for(var i=0;i<cbs.length;i++) cbs[i].checked = selRegs.indexOf(cbs[i].value)>=0;
  document.getElementById('modal-ov').classList.add('open');
}
function closeModal() {
  document.getElementById('modal-ov').classList.remove('open');
}
function updateTopbar() {
  document.getElementById('reg-count').textContent = selRegs.length + ' régua' + (selRegs.length!==1?'s':'') + ' selecionada' + (selRegs.length!==1?'s':'');
  var names = selRegs.map(function(id){
    var inf = FUNIL[id] || {};
    return inf.nome || id;
  });
  document.getElementById('reg-names').textContent = selRegs.length <= 3 ? names.join(', ') : names.slice(0,2).join(', ') + ' +' + (selRegs.length-2) + ' mais';
}

/* ── helpers ── */
function stag(s) {
  var cls = s === 'parcial' ? 'stp' : 'sta';
  var lbl = {ativo:'Ativo',passivo:'Passivo',sunset:'Sunset',parcial:'Parcial'}[s] || s;
  return '<span class="stag ' + cls + '">' + lbl + '</span>';
}
function getRegData(id) {
  for(var i=0;i<DATA.reguas.length;i++) if(DATA.reguas[i].id===id) return DATA.reguas[i];
  return null;
}
function sumChan(a, b) {
  if(!a) return b ? JSON.parse(JSON.stringify(b)) : null;
  if(!b) return JSON.parse(JSON.stringify(a));
  var r = {
    enviados: (a.enviados||0)+(b.enviados||0),
    entregues: (a.entregues||0)+(b.entregues||0),
    clicks: (a.clicks||0)+(b.clicks||0),
    conv: (a.conv||0)+(b.conv||0)
  };
  r.opens = (a.opens!=null||b.opens!=null) ? ((a.opens||0)+(b.opens||0)) : null;
  r.tx_entrega = r.enviados>0 ? (r.entregues/r.enviados*100) : 0;
  r.tx_abertura = (r.opens!=null&&r.entregues>0) ? (r.opens/r.entregues*100) : null;
  r.ctor = (r.opens!=null&&r.opens>0) ? (r.clicks/r.opens*100) : null;
  return r;
}
function aggregatePeriod(ids, per) {
  var agg = {leads:0, enviados:0, entregues:0, conv_total:0, receita:0, email:null, whatsapp:null, sms:null, webpush:null};
  for(var i=0;i<ids.length;i++) {
    var reg = getRegData(ids[i]);
    if(!reg) continue;
    var p = reg.periodos[per];
    if(!p) continue;
    agg.leads += p.leads||0;
    agg.enviados += p.enviados||0;
    agg.entregues += p.entregues||0;
    agg.conv_total += p.conv_total||0;
    agg.receita += p.receita||0;
    agg.email = sumChan(agg.email, p.email);
    agg.whatsapp = sumChan(agg.whatsapp, p.whatsapp);
    agg.sms = sumChan(agg.sms, p.sms);
    agg.webpush = sumChan(agg.webpush, p.webpush);
  }
  if(agg.enviados>0) agg.tx_entrega = (agg.entregues/agg.enviados*100);
  return agg;
}

/* ── períodos ── */
var MENSAL = [{id:'JUL',lbl:'Julho 2026'}];
var QUINZENAL = [
  {grp:'Julho', itens:[{id:'Q1',lbl:'Q1 01-15/07'},{id:'Q2',lbl:'Q2 16-31/07'}]}
];
var QS = ['Q1','Q2'], MS = ['JUL'];

function buildPeriods() {
  var w = document.getElementById('popts'); w.innerHTML = '';
  if (mode === 'mensal') {
    if (QS.indexOf(selPer) >= 0) selPer = 'JUL';
    var b = document.createElement('div'); b.className = 'pgrp';
    b.innerHTML = '<div class="pghdr">M\u00eas</div><div class="pgbtns" id="mbtns"></div>';
    w.appendChild(b);
    var btns = document.getElementById('mbtns');
    for (var i = 0; i < MENSAL.length; i++) {
      (function(p){
        var btn = document.createElement('button');
        btn.className = 'pbtn' + (selPer === p.id ? ' active' : '');
        btn.textContent = p.lbl;
        btn.onclick = function(){ selPer = p.id; buildPeriods(); render(); };
        btns.appendChild(btn);
      })(MENSAL[i]);
    }
  } else {
    if (MS.indexOf(selPer) >= 0) selPer = 'Q1';
    for (var g = 0; g < QUINZENAL.length; g++) {
      (function(grp){
        var b = document.createElement('div'); b.className = 'pgrp';
        b.innerHTML = '<div class="pghdr">' + grp.grp + '</div><div class="pgbtns"></div>';
        var btns = b.querySelector('.pgbtns');
        for (var i = 0; i < grp.itens.length; i++) {
          (function(p){
            var btn = document.createElement('button');
            btn.className = 'pbtn' + (selPer === p.id ? ' active' : '');
            btn.textContent = p.lbl;
            btn.onclick = function(){ selPer = p.id; buildPeriods(); render(); };
            btns.appendChild(btn);
          })(grp.itens[i]);
        }
        w.appendChild(b);
      })(QUINZENAL[g]);
    }
  }
}
var modeTabs = document.querySelectorAll('.mtab');
for (var ti = 0; ti < modeTabs.length; ti++) {
  (function(t){
    t.onclick = function(){
      for (var j = 0; j < modeTabs.length; j++) modeTabs[j].classList.remove('active');
      t.classList.add('active');
      mode = t.getAttribute('data-mode');
      buildPeriods(); render();
    };
  })(modeTabs[ti]);
}

/* ── render ── */
var cEnv = null, cCon = null;
function render() {
  if (!selRegs.length) return;
  var p, titleHtml, isAggregate = selRegs.length > 1;
  var pLbl = {Q1:'Q1 01/07-15/07',Q2:'Q2 16/07-31/07',JUL:'Julho 2026 (Q1+Q2)'}[selPer] || selPer;
  var ca = document.getElementById('ct');

  if (isAggregate) {
    p = aggregatePeriod(selRegs, selPer);
    titleHtml = '<div style="margin-bottom:15px"><h2 style="font-size:1rem;font-weight:700;display:flex;align-items:center;flex-wrap:wrap;gap:6px">' +
      'Soma das Réguas <span style="color:var(--muted);font-weight:400;font-size:.8rem">/ ' + selRegs.length + ' selecionadas</span></h2>' +
      '<div style="font-size:.73rem;color:var(--muted);margin-top:3px">' + pLbl + '</div></div>';
  } else {
    var reg = getRegData(selRegs[0]);
    if (!reg) return;
    var inf = FUNIL[reg.id] || {nome: reg.nome_curto, funil: 'A mapear', status: 'ativo'};
    p = reg.periodos[selPer];
    titleHtml = '<div style="margin-bottom:15px"><h2 style="font-size:1rem;font-weight:700;display:flex;align-items:center;flex-wrap:wrap;gap:6px">' +
      inf.nome + ' <span style="color:var(--muted);font-weight:400;font-size:.8rem">/ ' + reg.id + '</span>' +
      '<span class="fbadge">' + inf.funil + '</span></h2>' +
      '<div style="font-size:.73rem;color:var(--muted);margin-top:3px">' + pLbl + '</div></div>';
    if (reg.status === 'parcial')
      titleHtml += '<div class="warn">&#9888; R&eacute;gua com coleta parcial &mdash; ' + (reg.obs || 'alguns per&iacute;odos indispon&iacute;veis') + '</div>';
  }

  var h = titleHtml;
  if (!p) { h += '<p class="nd">Dados n&atilde;o dispon&iacute;veis para este per&iacute;odo.</p>'; ca.innerHTML = h; return; }
  var tc = p.leads > 0 ? (p.conv_total / p.leads * 100).toFixed(2) : '0.00';
  h += '<div class="krow">' +
    kc('c1','Leads',fmt(p.leads),'') + kc('','Enviados',fmt(p.enviados),'Entregues: ' + fmt(p.entregues) + ' (' + pct(p.tx_entrega) + ')') +
    kc('c2','Convers&otilde;es',fmt(p.conv_total),'Tx. ' + tc + '% sobre leads') +
    kc('c3','Receita Estimada',brl(p.receita),'TM: R$ 214,00') + '</div>';
  var cs = [];
  if (p.email)    cs.push({lbl:'E-mail',  clr:CC.email,  cls:'cte', d:p.email});
  if (p.whatsapp) cs.push({lbl:'WhatsApp',clr:CC.wa,     cls:'ctw', d:p.whatsapp});
  if (p.sms)      cs.push({lbl:'SMS',     clr:CC.sms,    cls:'cts', d:p.sms});
  if (p.webpush)  cs.push({lbl:'Web Push',clr:CC.webpush,cls:'ctp', d:p.webpush});
  h += '<div class="sec">Performance por Canal</div>';
  h += '<div class="tw"><table><thead><tr><th>Canal</th><th>Enviados</th><th>Entregues</th><th>Tx.Entrega</th><th>Aberturas</th><th>Tx.Abertura</th><th>Cliques</th><th>CTOR</th><th>Conv.</th></tr></thead><tbody>';
  for (var ci = 0; ci < cs.length; ci++) {
    var c = cs[ci], d = c.d;
    h += '<tr><td><span class="ct ' + c.cls + '"><span class="cdot" style="background:' + c.clr + '"></span>' + c.lbl + '</span></td>' +
      '<td>' + fmt(d.enviados) + '</td><td>' + fmt(d.entregues) + '</td><td>' + pct(d.tx_entrega) + '</td>' +
      '<td>' + (d.opens != null ? fmt(d.opens) : '<span class="nd">n/a</span>') + '</td>' +
      '<td>' + (d.tx_abertura != null ? pct(d.tx_abertura) : '<span class="nd">n/a</span>') + '</td>' +
      '<td>' + fmt(d.clicks) + '</td>' +
      '<td>' + (d.ctor != null ? pct(d.ctor) : '<span class="nd">-</span>') + '</td>' +
      '<td><strong>' + fmt(d.conv) + '</strong></td></tr>';
  }
  if (!cs.length) h += '<tr><td colspan="9" class="nd" style="padding:12px">Sem dados de canais.</td></tr>';
  h += '</tbody></table></div>';
  h += '<div class="crow"><div class="ccard"><h4>Enviados por Canal</h4><canvas id="ce" height="180"></canvas></div>' +
       '<div class="ccard"><h4>Convers&otilde;es por Canal</h4><canvas id="cc" height="180"></canvas></div></div>';
  h += '<div class="sec">Evolu&ccedil;&atilde;o do Per&iacute;odo</div>' + evoTable(selRegs);
  ca.innerHTML = h;
  if (cEnv) { cEnv.destroy(); cEnv = null; }
  if (cCon) { cCon.destroy(); cCon = null; }
  if (!cs.length) return;
  var lbls = [], clrs = [], envD = [], conD = [];
  for (var ci2 = 0; ci2 < cs.length; ci2++) {
    lbls.push(cs[ci2].lbl); clrs.push(cs[ci2].clr);
    envD.push(cs[ci2].d.enviados || 0); conD.push(cs[ci2].d.conv || 0);
  }
  var base = {responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true},x:{}}};
  cEnv = new Chart(document.getElementById('ce'),{type:'bar',data:{labels:lbls,datasets:[{data:envD,backgroundColor:clrs,borderRadius:5}]},options:base});
  cCon = new Chart(document.getElementById('cc'),{type:'bar',data:{labels:lbls,datasets:[{data:conD,backgroundColor:clrs,borderRadius:5}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}},x:{}}}});
}

function kc(cls,lbl,val,sub){return '<div class="kpi '+cls+'"><div class="klbl">'+lbl+'</div><div class="kval">'+val+'</div>'+(sub?'<div class="ksub">'+sub+'</div>':'')+' </div>';}
function evoTable(ids){
  var qc=['Q1','Q2'],qh=['Q1 Jul','Q2 Jul'];
  var mc=['JUL'],mh=['Julho 2026'];
  var rows=[{lbl:'Leads',fn:function(d){return fmt(d.leads);}},{lbl:'Enviados',fn:function(d){return fmt(d.enviados);}},
    {lbl:'Entregues',fn:function(d){return fmt(d.entregues);}},{lbl:'Convers&otilde;es',fn:function(d){return fmt(d.conv_total);}},
    {lbl:'Receita',fn:function(d){return brl(d.receita);}}];
  function getP(per){ return ids.length===1 ? (getRegData(ids[0])||{periodos:{}}).periodos[per] : aggregatePeriod(ids,per); }
  var h='<div class="tw"><table><thead><tr><th>M&eacute;trica</th>';
  for(var i=0;i<qh.length;i++) h+='<th>'+qh[i]+'</th>';
  for(var i=0;i<mh.length;i++) h+='<th class="mth">'+mh[i]+'</th>';
  h+='</tr></thead><tbody>';
  for(var r=0;r<rows.length;r++){
    h+='<tr><td style="font-weight:600">'+rows[r].lbl+'</td>';
    for(var i=0;i<qc.length;i++){var p=getP(qc[i]);h+='<td>'+(p?rows[r].fn(p):'<span class="nd">-</span>')+'</td>';}
    for(var i=0;i<mc.length;i++){var p=getP(mc[i]);h+='<td class="mth">'+(p?rows[r].fn(p):'<span class="nd">-</span>')+'</td>';}
    h+='</tr>';
  }
  return h+'</tbody></table></div>';
}
