<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Réguas Técnico | Anhanguera</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--primary:#1e3a5f;--bg:#f4f6fa;--card:#fff;--border:#dee2e8;--text:#1a2337;--muted:#6c757d;
  --email:#4361ee;--wa:#25d366;--sms:#f4a261;--wp:#e63946;--teal:#0096b2;--green:#2a9d8f;--amber:#c9a227}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text)}
#err{display:none;position:fixed;top:0;left:0;right:0;padding:12px 20px;background:#c00;color:#fff;font-size:.85rem;z-index:9999}
.hdr{background:var(--primary);color:#fff;padding:13px 24px;display:flex;align-items:center;gap:14px}
.hdr img{height:34px}.hdiv{width:1px;height:30px;background:rgba(255,255,255,.25)}
.hdr h1{font-size:1.05rem;font-weight:700}.sub{font-size:.73rem;opacity:.7;margin-top:2px}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.main{padding:20px 24px}
.reg-btn{display:flex;align-items:center;gap:8px;background:var(--primary);color:#fff;border:none;border-radius:7px;padding:8px 16px;font-size:.83rem;font-weight:600;cursor:pointer}
.reg-btn:hover{opacity:.88}
.reg-count{background:rgba(255,255,255,.22);border-radius:4px;padding:1px 7px;font-size:.75rem;font-weight:700}
.reg-names{font-size:.78rem;color:var(--muted);max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center}
.modal-ov.open{display:flex}
.modal{background:#fff;border-radius:12px;width:min(760px,95vw);max-height:85vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.18)}
.modal-hdr{padding:16px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-hdr h3{font-size:.95rem;font-weight:700;color:var(--primary)}
.modal-close{background:none;border:none;font-size:1.3rem;color:var(--muted);cursor:pointer;line-height:1;padding:0 4px}
.modal-acts{padding:8px 20px;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.modal-acts button{background:none;border:1px solid var(--border);border-radius:5px;padding:4px 12px;font-size:.77rem;font-weight:600;color:var(--primary);cursor:pointer}
.modal-acts button:hover{background:var(--bg)}
.modal-list{overflow-y:auto;padding:8px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px}
.mitem{display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer}
.mitem:hover{background:var(--bg)}
.mitem input[type=checkbox]{margin-top:2px;accent-color:var(--teal);width:15px;height:15px;flex-shrink:0;cursor:pointer}
.mitem-name{font-size:.8rem;font-weight:600;line-height:1.2}
.mitem-id{font-size:.67rem;color:var(--muted);margin-top:2px}
.modal-ftr{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.btn-confirm{background:var(--teal);color:#fff;border:none;border-radius:7px;padding:8px 22px;font-size:.83rem;font-weight:700;cursor:pointer}
.btn-cancel{background:none;border:1px solid var(--border);border-radius:7px;padding:8px 16px;font-size:.83rem;color:var(--muted);cursor:pointer}
.stag{border-radius:3px;padding:1px 6px;font-size:.64rem;font-weight:700;display:inline-block}
.stf{background:#e8f4ff;color:#1a5fa0}.sto{background:#f0f0f4;color:#555}
.psel{margin-bottom:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.pgrp{background:#fff;border:1px solid var(--border);border-radius:7px;overflow:hidden;width:fit-content}
.pghdr{background:#f0f2f7;padding:3px 12px;font-size:.67rem;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.pgbtns{display:flex}
.pbtn{padding:7px 15px;border:none;cursor:pointer;font-size:.8rem;background:transparent;color:var(--muted);font-weight:500;border-top:2px solid transparent}
.pbtn:hover{background:var(--bg);color:var(--text)}
.pbtn.active{color:var(--primary);font-weight:700;border-top-color:var(--primary);background:#f0f5ff}
.krow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border-radius:9px;padding:14px 15px;border:1px solid var(--border);position:relative;overflow:hidden}
.kpi:before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:#e63946}
.kpi.c1:before{background:var(--teal)}.kpi.c2:before{background:var(--green)}.kpi.c3:before{background:var(--amber)}
.klbl{font-size:.67rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.kval{font-size:1.5rem;font-weight:700;line-height:1.1}.ksub{font-size:.71rem;color:var(--muted);margin-top:3px}
.sec{font-size:.8rem;font-weight:700;color:var(--primary);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.sec:after{content:'';flex:1;height:1px;background:var(--border)}
.tw{background:var(--card);border-radius:9px;border:1px solid var(--border);overflow-x:auto;margin-bottom:18px}
table{width:100%;border-collapse:collapse;font-size:.81rem}
thead th{background:#f8f9fc;padding:8px 12px;text-align:left;font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:8px 12px;border-bottom:1px solid #f0f2f5;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}tbody tr:hover td{background:#f8fafc}
.ct{display:inline-flex;align-items:center;gap:5px;border-radius:4px;padding:2px 7px;font-size:.7rem;font-weight:700}
.cte{background:#dde8ff;color:#2b45c8}.ctw{background:#d1f5e0;color:#1a6b35}
.cts{background:#fde8d5;color:#9a4010}.ctp{background:#fde8e8;color:#a02020}
.cdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
.mth{background:#f0f3fa!important;font-weight:700!important;color:var(--primary)!important}
.crow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.ccard{background:var(--card);border-radius:9px;border:1px solid var(--border);padding:15px}
.ccard h4{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.nd{color:var(--muted);font-style:italic;font-size:.82rem}
.fbadge{display:inline-block;background:#e8f4ff;color:#1a5fa0;border-radius:4px;padding:2px 8px;font-size:.7rem;font-weight:600;margin-left:6px;vertical-align:middle}
.note{font-size:.72rem;color:var(--muted);margin:-8px 0 18px}
.dpos{color:#15803d;font-size:.72rem;font-weight:600}
.dneg{color:#b91c1c;font-size:.72rem;font-weight:600}
.bar{height:6px;border-radius:3px;background:#eef0f5;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--teal)}
@media(max-width:820px){.crow{grid-template-columns:1fr}.main{padding:14px}}
</style>
</head>

/* modal */
function buildModal(){
  var list=document.getElementById('modal-list');list.innerHTML='';
  for(var i=0;i<DATA.reguas.length;i++){
    var r=DATA.reguas[i];
    var el=document.createElement('label');el.className='mitem';el.setAttribute('data-etapa',r.etapa);
    el.innerHTML='<input type="checkbox" value="'+r.id+'" checked><div><div class="mitem-name">'+r.nome+'</div>'+
      '<div class="mitem-id">'+r.id+' <span class="stag stf">'+r.etapa+'</span> <span class="stag sto">'+r.operacao+'</span></div></div>';
    list.appendChild(el);
  }
  function setAll(v,etapa){
    var its=document.querySelectorAll('#modal-list .mitem');
    for(var i=0;i<its.length;i++){
      var cb=its[i].querySelector('input');
      if(etapa) cb.checked=(its[i].getAttribute('data-etapa')===etapa);
      else cb.checked=v;
    }
  }
  document.getElementById('open-modal').onclick=function(){
    var cbs=document.querySelectorAll('#modal-list input');
    for(var i=0;i<cbs.length;i++) cbs[i].checked=selRegs.indexOf(cbs[i].value)>=0;
    document.getElementById('modal-ov').classList.add('open');
  };
  function close(){document.getElementById('modal-ov').classList.remove('open');}
  document.getElementById('modal-close').onclick=close;
  document.getElementById('modal-cancel').onclick=close;
  document.getElementById('modal-ov').onclick=function(e){if(e.target===this)close();};
  document.getElementById('sel-all').onclick=function(){setAll(true);};
  document.getElementById('sel-none').onclick=function(){setAll(false);};
  var eb=document.querySelectorAll('.modal-acts button[data-etapa]');
  for(var i=0;i<eb.length;i++)(function(b){b.onclick=function(){setAll(false,b.getAttribute('data-etapa'));};})(eb[i]);
  document.getElementById('modal-confirm').onclick=function(){
    var cbs=document.querySelectorAll('#modal-list input');selRegs=[];
    for(var i=0;i<cbs.length;i++) if(cbs[i].checked) selRegs.push(cbs[i].value);
    if(!selRegs.length){alert('Selecione ao menos uma régua.');return;}
    close();topbar();render();
  };
}
function topbar(){
  document.getElementById('reg-count').textContent=selRegs.length;
  var nm=selRegs.map(function(id){var r=reg(id);return r?r.nome:id;});
  document.getElementById('reg-names').textContent=selRegs.length<=3?nm.join(' · '):nm.slice(0,2).join(' · ')+' +'+(selRegs.length-2)+' outras';
}
function lblDe(id){for(var i=0;i<PER.length;i++) if(PER[i].id===id) return PER[i].lbl; return id;}
function buildPer(){
  var w=document.getElementById('psel');w.innerHTML='';
  for(var g=0;g<GRUPOS.length;g++)(function(grp){
    var box=document.createElement('div');box.className='pgrp';
    var hd=document.createElement('div');hd.className='pghdr';hd.textContent=grp.g;box.appendChild(hd);
    var bt=document.createElement('div');bt.className='pgbtns';
    for(var i=0;i<grp.ids.length;i++)(function(id){
      var b=document.createElement('button');
      b.className='pbtn'+(selPer===id?' active':'');b.textContent=lblDe(id);
      b.onclick=function(){selPer=id;buildPer();render();};
      bt.appendChild(b);
    })(grp.ids[i]);
    box.appendChild(bt);w.appendChild(box);
  })(GRUPOS[g]);
}

/* render */
var chE=null,chC=null;
function kc(cls,lbl,val,sub){return '<div class="kpi '+cls+'"><div class="klbl">'+lbl+'</div><div class="kval">'+val+'</div>'+(sub?'<div class="ksub">'+sub+'</div>':'')+'</div>';}
function delta(c,p){
  if(c==null||p==null||p===0) return '';
  var d=(c-p)/Math.abs(p)*100;
  return ' <span class="'+(d>0?'dpos':(d<0?'dneg':''))+'">'+(d>0?'+':'')+d.toFixed(1)+'%</span>';
}
function render(){
  var ca=document.getElementById('ct');
  if(!selRegs.length){ca.innerHTML='<p class="nd">Selecione ao menos uma r&eacute;gua.</p>';return;}
  var p=agg(selRegs,selPer);
  var lbl='';for(var i=0;i<PER.length;i++) if(PER[i].id===selPer) lbl=PER[i].lbl;
  var h='';
  if(selRegs.length===1){
    var r=reg(selRegs[0]);
    h+='<div style="margin-bottom:15px"><h2 style="font-size:1rem;font-weight:700">'+r.nome+
       ' <span style="color:var(--muted);font-weight:400;font-size:.8rem">/ '+r.id+'</span>'+
       '<span class="fbadge">'+r.etapa+'</span></h2><div style="font-size:.73rem;color:var(--muted);margin-top:3px">'+lbl+'</div></div>';
  } else {
    h+='<div style="margin-bottom:15px"><h2 style="font-size:1rem;font-weight:700">Soma de '+selRegs.length+' r&eacute;guas</h2>'+
       '<div style="font-size:.73rem;color:var(--muted);margin-top:3px">'+lbl+'</div></div>';
  }
  var txc=p.leads?(p.conv_total/p.leads*100).toFixed(2):'0.00';
  h+='<div class="krow">'+
     kc('c1','Leads (Entered)',fmt(p.leads),'')+
     kc('','Enviados',fmt(p.enviados),'Entregues '+fmt(p.entregues)+' &middot; '+pct(p.tx_entrega))+
     kc('c2','Convers&otilde;es',fmt(p.conv_total),'Direta '+fmt(p.conv_direta)+' &middot; Assistida '+fmt(p.conv_assist))+
     kc('c3','Receita Estimada',brl(p.receita),'Ticket m&eacute;dio '+brl(DATA.meta.ticket_medio))+
     '</div>';
  h+='<div class="note">Convers&atilde;o direta = relat&oacute;rio Click-Through. Assistida = View-Through. Receita = (direta + assistida) &times; ticket m&eacute;dio.</div>';

  var cs=[];
  for(var k=0;k<CHANS.length;k++){var c=CHANS[k];if(p[c]&&p[c].enviados>0) cs.push({key:c,d:p[c]});}
  h+='<div class="sec">Performance por canal</div><div class="tw"><table><thead><tr>'+
     '<th>Canal</th><th>Enviados</th><th>Entregues</th><th>Tx. entrega</th><th>Aberturas</th><th>Tx. abertura</th>'+
     '<th>Cliques</th><th>Tx. clique</th><th>CTOR</th><th>Conv. direta</th><th>Conv. assistida</th></tr></thead><tbody>';
  for(var i=0;i<cs.length;i++){
    var c=cs[i],d=c.d;
    h+='<tr><td><span class="ct '+CLS[c.key]+'"><span class="cdot" style="background:'+CC[c.key]+'"></span>'+CLBL[c.key]+'</span></td>'+
       '<td>'+fmt(d.enviados)+'</td><td>'+fmt(d.entregues)+'</td><td>'+pct(d.tx_entrega)+'</td>'+
       '<td>'+(d.opens!=null?fmt(d.opens):'<span class="nd">n/a</span>')+'</td>'+
       '<td>'+(d.tx_abertura!=null?pct(d.tx_abertura):'<span class="nd">n/a</span>')+'</td>'+
       '<td>'+fmt(d.clicks)+'</td><td>'+pct(d.ctr)+'</td>'+
       '<td>'+(d.ctor!=null?pct(d.ctor):'<span class="nd">n/a</span>')+'</td>'+
       '<td><strong>'+fmt(d.conv)+'</strong></td><td>'+fmt(d.conv_assist)+'</td></tr>';
  }
  if(!cs.length) h+='<tr><td colspan="11" class="nd" style="padding:12px">Sem envios no per&iacute;odo.</td></tr>';
  h+='</tbody></table></div>';
  var hasChart = (typeof Chart !== 'undefined');
  if(hasChart){
    h+='<div class="crow"><div class="ccard"><h4>Enviados por canal</h4><canvas id="ce" height="190"></canvas></div>'+
       '<div class="ccard"><h4>Convers&otilde;es por canal (direta)</h4><canvas id="cc" height="190"></canvas></div></div>';
  } else {
    h+='<div class="note" style="margin:0 0 18px">Gr&aacute;ficos indispon&iacute;veis: a biblioteca Chart.js n&atilde;o carregou (sem acesso &agrave; internet). As tabelas acima trazem os mesmos n&uacute;meros.</div>';
  }
  h+='<div class="sec">Evolu&ccedil;&atilde;o — quinzenas e meses</div>'+evo();
  if(selRegs.length>1) h+='<div class="sec">R&eacute;guas no per&iacute;odo</div>'+ranking();
  ca.innerHTML=h;

  if(chE){chE.destroy();chE=null;} if(chC){chC.destroy();chC=null;}
  if(!cs.length||!hasChart) return;
  var L=[],C=[],E=[],V=[];
  for(var i=0;i<cs.length;i++){L.push(CLBL[cs[i].key]);C.push(CC[cs[i].key]);E.push(cs[i].d.enviados);V.push(cs[i].d.conv);}
  var op={responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'#eef0f5'}},x:{grid:{display:false}}}};
  chE=new Chart(document.getElementById('ce'),{type:'bar',data:{labels:L,datasets:[{data:E,backgroundColor:C,borderRadius:5}]},options:op});
  var op2=JSON.parse(JSON.stringify(op));op2.scales.y.ticks={precision:0};
  chC=new Chart(document.getElementById('cc'),{type:'bar',data:{labels:L,datasets:[{data:V,backgroundColor:C,borderRadius:5}]},options:op2});
}
function evo(){
  var rows=[
    {l:'Leads (Entered)',f:function(p){return p.leads;},fm:fmt},
    {l:'Enviados',f:function(p){return p.enviados;},fm:fmt},
    {l:'Entregues',f:function(p){return p.entregues;},fm:fmt},
    {l:'Tx. entrega',f:function(p){return p.tx_entrega;},fm:pct},
    {l:'Aberturas e-mail',f:function(p){return p.email?p.email.opens:null;},fm:fmt},
    {l:'CTOR e-mail',f:function(p){return p.email?p.email.ctor:null;},fm:pct},
    {l:'Aberturas WhatsApp',f:function(p){return p.whatsapp?p.whatsapp.opens:null;},fm:fmt},
    {l:'CTOR WhatsApp',f:function(p){return p.whatsapp?p.whatsapp.ctor:null;},fm:pct},
    {l:'Convers&atilde;o direta',f:function(p){return p.conv_direta;},fm:fmt},
    {l:'Convers&atilde;o assistida',f:function(p){return p.conv_assist;},fm:fmt},
    {l:'Receita estimada',f:function(p){return p.receita;},fm:brl}
  ];
  var qs=[];for(var i=0;i<QUINZ.length;i++) qs.push(agg(selRegs,QUINZ[i]));
  var ps=[];for(var i=0;i<MESES.length;i++) ps.push(agg(selRegs,MESES[i]));
  var tot=agg(selRegs,'TOTAL');
  var h='<div class="tw"><table><thead><tr><th>M&eacute;trica</th>';
  for(var i=0;i<QUINZ.length;i++) h+='<th>'+lblDe(QUINZ[i])+'</th>';
  for(var i=0;i<MESES.length;i++) h+='<th class="mth">'+lblDe(MESES[i])+'</th>';
  h+='<th class="mth">Total</th></tr></thead><tbody>';
  for(var r=0;r<rows.length;r++){
    var row=rows[r];h+='<tr><td style="font-weight:600">'+row.l+'</td>';
    for(var i=0;i<qs.length;i++){
      var v=row.f(qs[i]),d=i>0?delta(v,row.f(qs[i-1])):'';
      h+='<td>'+row.fm(v)+d+'</td>';
    }
    for(var i=0;i<ps.length;i++){
      var v=row.f(ps[i]),d=i>0?delta(v,row.f(ps[i-1])):'';
      h+='<td class="mth">'+row.fm(v)+d+'</td>';
    }
    h+='<td class="mth">'+row.fm(row.f(tot))+'</td></tr>';
  }
  h+='</tbody></table></div>';
  h+='<div class="note">Aberturas s\u00e3o contagem de usu\u00e1rio \u00fanico por per\u00edodo — por isso a soma das duas quinzenas pode superar levemente o m\u00eas (cerca de 1,5% no agregado). Todas as demais m\u00e9tricas fecham exatamente.</div>';
  return h;
}
function ranking(){
  var arr=[];
  for(var i=0;i<selRegs.length;i++){
    var r=reg(selRegs[i]);if(!r)continue;
    var p=r.periodos[selPer];
    arr.push({n:r.nome,id:r.id,e:r.etapa,env:p.enviados,ent:p.entregues,cd:p.conv_direta,ca:p.conv_assist,
              ct:p.conv_direta+p.conv_assist,rc:p.receita,lead:p.leads});
  }
  arr.sort(function(a,b){return b.ct-a.ct;});
  var max=arr.length?Math.max.apply(null,arr.map(function(x){return x.ct;})):0;
  var h='<div class="tw"><table><thead><tr><th>R&eacute;gua</th><th>Etapa</th><th>Leads</th><th>Enviados</th><th>Entregues</th>'+
        '<th>Direta</th><th>Assistida</th><th>Total conv.</th><th style="width:120px">Peso</th><th>Receita</th></tr></thead><tbody>';
  for(var i=0;i<arr.length;i++){
    var a=arr[i],w=max?Math.round(a.ct/max*100):0;
    h+='<tr><td style="font-weight:600">'+a.n+' <span style="color:var(--muted);font-weight:400">'+a.id+'</span></td>'+
       '<td><span class="stag stf">'+a.e+'</span></td><td>'+fmt(a.lead)+'</td><td>'+fmt(a.env)+'</td><td>'+fmt(a.ent)+'</td>'+
       '<td><strong>'+fmt(a.cd)+'</strong></td><td>'+fmt(a.ca)+'</td><td><strong>'+fmt(a.ct)+'</strong></td>'+
       '<td><div class="bar"><i style="width:'+w+'%"></i></div></td><td>'+brl(a.rc)+'</td></tr>';
  }
  return h+'</tbody></table></div>';
}
document.getElementById('hmeta').textContent=DATA.meta.conta+' · '+DATA.meta.segmento+' · '+DATA.meta.total_reguas+
  ' réguas · '+DATA.meta.periodo+' · gerado em '+DATA.meta.gerado_em;
selRegs=DATA.reguas.map(function(r){return r.id;});
buildModal();buildPer();topbar();render();
</script>
</body>
</html>
