<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Multiprodutos Réguas Técnico | Anhanguera</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --primary:  #1e3a5f;
    --bg:       #f4f6fa;
    --card-bg:  #ffffff;
    --border:   #dee2e8;
    --text:     #1a2337;
    --muted:    #6c757d;
    --email-c:  #4361ee;
    --wa-c:     #25d366;
    --sms-c:    #f4a261;
    --wp-c:     #e63946;
    --teal:     #0096b2;
    --green:    #2a9d8f;
    --amber:    #e9c46a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }

  /* ── Header ── */
  .header {
    background: var(--primary); color: #fff;
    padding: 14px 28px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .header-left  { display: flex; align-items: center; gap: 14px; }
  .header-logo  { height: 36px; width: auto; }
  .header-divider { width: 1px; height: 32px; background: rgba(255,255,255,.25); }
  .header-title h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: .02em; }
  .header-title .sub { font-size: .76rem; opacity: .7; margin-top: 2px; }

  /* ── Layout ── */
  .layout { display: flex; min-height: calc(100vh - 64px); }
  .sidebar { width: 232px; min-width: 180px; background: #fff; border-right: 1px solid var(--border); padding: 12px 0; flex-shrink: 0; }
  .main    { flex: 1; padding: 22px 26px; overflow-x: auto; }

  /* ── Sidebar ── */
  .sidebar-label { padding: 8px 14px 4px; font-size: .68rem; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: .08em; }
  .sidebar-item  { display: block; padding: 9px 14px; cursor: pointer; transition: background .15s; border-left: 3px solid transparent; }
  .sidebar-item:hover { background: var(--bg); }
  .sidebar-item.active { background: #e8effe; border-left-color: var(--teal); }
  .s-name  { font-size: .82rem; font-weight: 600; color: var(--text); }
  .sidebar-item.active .s-name { color: var(--primary); }
  .s-id    { font-size: .7rem; color: var(--muted); margin-top: 2px; }
  .s-tags  { margin-top: 4px; display: flex; gap: 4px; flex-wrap: wrap; }
  .stag { display: inline-block; border-radius: 3px; padding: 1px 6px; font-size: .65rem; font-weight: 700; }
  .stag-ativo   { background: #d4edda; color: #1a6b35; }
  .stag-passivo { background: #f8f9fa; color: #6c757d; border: 1px solid #dee2e8; }
  .stag-sunset  { background: #fde8e8; color: #a02020; }
  .stag-parcial { background: #fff3cd; color: #7d5a00; }

  /* ── Funil badge no título ── */
  .funil-badge { display: inline-block; background: #e8f4ff; color: #1a5fa0; border-radius: 4px; padding: 2px 8px; font-size: .72rem; font-weight: 600; margin-left: 8px; vertical-align: middle; }

  /* ── Period selector ── */
  .period-selector { margin-bottom: 20px; }
  .period-mode-tabs { display: flex; gap: 0; background: #fff; border: 1px solid var(--border); border-radius: 8px; width: fit-content; overflow: hidden; margin-bottom: 10px; }
  .mode-tab { padding: 7px 20px; border: none; cursor: pointer; font-size: .82rem; font-weight: 600; background: transparent; color: var(--muted); transition: all .15s; }
  .mode-tab.active { background: var(--primary); color: #fff; }

  .period-options { display: flex; gap: 10px; flex-wrap: wrap; }
  .period-group-block { background: #fff; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .period-group-header { background: #f0f2f7; padding: 4px 12px; font-size: .68rem; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: .07em; }
  .period-group-btns { display: flex; }
  .period-btn { padding: 7px 14px; border: none; cursor: pointer; font-size: .82rem; background: transparent; color: var(--muted); font-weight: 500; transition: all .15s; border-top: 2px solid transparent; }
  .period-btn:hover  { background: var(--bg); color: var(--text); }
  .period-btn.active { color: var(--primary); font-weight: 700; border-top-color: var(--primary); background: #f0f5ff; }

  /* ── KPI Cards ── */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi-card { background: var(--card-bg); border-radius: 10px; padding: 15px 16px; border: 1px solid var(--border); position: relative; overflow: hidden; }
  .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: #e63946; }
  .kpi-card.c-blue::before   { background: var(--teal); }
  .kpi-card.c-green::before  { background: var(--green); }
  .kpi-card.c-amber::before  { background: #c9a227; }
  .kpi-card.c-red::before    { background: #e63946; }
  .kpi-label { font-size: .68rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; }
  .kpi-val   { font-size: 1.55rem; font-weight: 700; line-height: 1.1; }
  .kpi-sub   { font-size: .73rem; color: var(--muted); margin-top: 3px; }

  /* ── Section title ── */
  .section-title { font-size: .82rem; font-weight: 700; color: var(--primary); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* ── Tables ── */
  .table-wrap { background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  thead th { background: #f8f9fc; padding: 9px 13px; text-align: left; font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-bottom: 1px solid var(--border); }
  tbody td { padding: 9px 13px; border-bottom: 1px solid #f0f2f5; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #f8fafc; }
  .ctag { display: inline-flex; align-items: center; gap: 5px; border-radius: 4px; padding: 2px 8px; font-size: .72rem; font-weight: 700; }
  .ctag-email { background: #dde8ff; color: #2b45c8; }
  .ctag-wa    { background: #d1f5e0; color: #1a6b35; }
  .ctag-sms   { background: #fde8d5; color: #9a4010; }
  .ctag-wp    { background: #fde8e8; color: #a02020; }
  .cdot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

  /* ── Charts ── */
  .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .chart-card { background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border); padding: 16px; }
  .chart-card h4 { font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 12px; }

  .partial-notice { background: #fff8e1; border: 1px solid #f0c040; border-radius: 8px; padding: 9px 14px; font-size: .8rem; color: #7d5a00; margin-bottom: 14px; }
  .no-data { color: var(--muted); font-style: italic; font-size: .84rem; }
  .month-header-col { background: #f0f3fa !important; font-weight: 700 !important; color: var(--primary) !important; font-size: .75rem !important; }

  @media (max-width: 768px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    .charts-row { grid-template-columns: 1fr; }
    .main { padding: 14px; }
  }
</style>
</head>

    <div class="header-divider"></div>
    <div class="header-title">
      <h1>Dashboard Multiprodutos Réguas Técnico</h1>
      <div class="sub" id="header-meta">Anhanguera · TEC · Carregando…</div>
    </div>

</div>

<!-- LAYOUT -->
<div class="layout">
  <nav class="sidebar">
    <div class="sidebar-label">Réguas</div>
    <div id="regua-list"></div>
  </nav>

  <main class="main">
    <!-- SELETOR DE PERÍODO -->
    <div class="period-selector">
      <div class="period-mode-tabs">
        <button class="mode-tab active" data-mode="mensal">Mensal</button>
        <button class="mode-tab" data-mode="quinzenal">Quinzenal</button>
      </div>
      <div class="period-options" id="period-options"></div>
    </div>

    <div id="content-area">
      <p class="no-data">Selecione uma régua no menu lateral.</p>
    </div>
  </main>
</div>

<script>
// ── Estado ──────────────────────────────────────────────────
let DATA = null, selectedRegua = null, selectedPeriod = 'JUL', periodMode = 'mensal';

// ── Formatadores ─────────────────────────────────────────────
const fmt    = n => n == null ? '—' : n.toLocaleString('pt-BR');
const fmtPct = n => n == null ? '—' : n.toFixed(2) + '%';
const fmtR   = n => n == null ? '—' : 'R$\u202f' + n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});

// ── Inventário de funil (confirmado + placeholder) ───────────
const FUNIL = {
  '3511': { nome: 'Semi Inscrito TEC',       funil: 'Semi Inscrito',   status: 'ativo'   },
  '3704': { nome: 'Semi Inscrito TEC v2',    funil: 'Semi Inscrito',   status: 'ativo'   },
  '3554': { nome: 'Inscrito TEC — SMS',      funil: 'Inscrito',        status: 'ativo'   },
  '3878': { nome: 'Inscrito TEC — Multicanal', funil: 'Inscrito',      status: 'ativo'   },
  '3900': { nome: 'Aprovado TEC',            funil: 'Aprovado',        status: 'ativo'   },
  '3901': { nome: 'Aprovado TEC — Multicanal', funil: 'Aprovado',      status: 'ativo'   },
  '3935': { nome: 'Inscrito TEC — Massa',    funil: 'Inscrito',        status: 'ativo'   },
  '3943': { nome: 'Inscrito TEC — Seg.',     funil: 'Inscrito',        status: 'ativo'   },
  '3951': { nome: 'Inscrito TEC — Coorte',   funil: 'Inscrito',        status: 'parcial' },
};
// Nota: etapas de funil marcadas "A mapear" foram estimadas a partir dos
// nomes do Insider One. Confirmar com o inventário oficial de réguas TEC.

// Cores fixas por canal (hex direto para Chart.js)
const CANAL_COLORS = {
  email:    '#4361ee',
  wa:       '#25d366',
  sms:      '#f4a261',
  webpush:  '#e63946'
};

// ── Carregar JSON ────────────────────────────────────────────
async function loadData() {
  try {
    const r = await fetch('./data.json');
    DATA = await r.json();
    init();
  } catch(e) {
    document.getElementById('content-area').innerHTML =
      '<p style="color:#c00">Erro ao carregar data.json: ' + e.message + '</p>';
  }
}

function init() {
  const m = DATA.meta;
  document.getElementById('header-meta').textContent =
    m.conta + ' · ' + m.segmento + ' · ' + m.total_reguas + ' réguas · Gerado em ' + m.gerado_em;
  buildSidebar();
  buildPeriodOptions();
  if (DATA.reguas.length) selectRegua(DATA.reguas[0].id);
}

// ── Sidebar ──────────────────────────────────────────────────
function buildSidebar() {
  const list = document.getElementById('regua-list');
  list.innerHTML = '';
  DATA.reguas.forEach(r => {
    const info = FUNIL[r.id] || { nome: r.nome_curto, funil: 'A mapear', status: 'ativo' };
    const el = document.createElement('div');
    el.className = 'sidebar-item';
    el.dataset.id = r.id;
    el.innerHTML =
      '<div class="s-name">' + info.nome + '</div>' +
      '<div class="s-id">' + r.id + '</div>' +
      '<div class="s-tags">' +
        statusTag(info.status) +
        '<span class="stag" style="background:#e8f4ff;color:#1a5fa0">' + info.funil + '</span>' +
      '</div>';
    el.onclick = () => selectRegua(r.id);
    list.appendChild(el);
  });
}

function statusTag(s) {
  const map = { ativo:'stag-ativo', passivo:'stag-passivo', sunset:'stag-sunset', parcial:'stag-parcial' };
  const label = { ativo:'Ativo', passivo:'Passivo', sunset:'Sunset', parcial:'Parcial' };
  return '<span class="stag ' + (map[s]||'stag-passivo') + '">' + (label[s]||s) + '</span>';
}

function selectRegua(id) {
  selectedRegua = id;
  document.querySelectorAll('.sidebar-item').forEach(el =>
    el.classList.toggle('active', el.dataset.id === id));
  render();
}

// ── Seletor de período ───────────────────────────────────────
const MENSAL_CONFIG = [
  { id:'JUL', label:'Julho 2026' },
  { id:'AGO', label:'Agosto 2026' },
  { id:'SET', label:'Setembro (parcial)' }
];
const QUINZENAL_CONFIG = [
  { group:'Julho',    itens:[{ id:'Q1', label:'Q1 01–15/07'},{ id:'Q2', label:'Q2 16–31/07'}] },
  { group:'Agosto',   itens:[{ id:'Q3', label:'Q3 01–15/08'},{ id:'Q4', label:'Q4 16–31/08'}] },
  { group:'Setembro', itens:[{ id:'Q5', label:'Q5 01–02/09 ⚠'}] }
];

function buildPeriodOptions() {
  const wrap = document.getElementById('period-options');
  wrap.innerHTML = '';
  if (periodMode === 'mensal') {
    const block = document.createElement('div');
    block.className = 'period-group-block';
    block.innerHTML = '<div class="period-group-header">Mês</div><div class="period-group-btns" id="mensal-btns"></div>';
    wrap.appendChild(block);
    const btns = document.getElementById('mensal-btns');
    MENSAL_CONFIG.forEach(p => {
      const b = document.createElement('button');
      b.className = 'period-btn' + (selectedPeriod === p.id ? ' active' : '');
      b.textContent = p.label;
      b.onclick = () => { selectedPeriod = p.id; buildPeriodOptions(); render(); };
      btns.appendChild(b);
    });
    // Se período selecionado é quinzenal, default para JUL
    if (['Q1','Q2','Q3','Q4','Q5'].includes(selectedPeriod)) {
      selectedPeriod = 'JUL';
    }
  } else {
    QUINZENAL_CONFIG.forEach(g => {
      const block = document.createElement('div');
      block.className = 'period-group-block';
      block.innerHTML = '<div class="period-group-header">' + g.group + '</div><div class="period-group-btns"></div>';
      const btns = block.querySelector('.period-group-btns');
      g.itens.forEach(p => {
        const b = document.createElement('button');
        b.className = 'period-btn' + (selectedPeriod === p.id ? ' active' : '');
        b.textContent = p.label;
        b.onclick = () => { selectedPeriod = p.id; buildPeriodOptions(); render(); };
        btns.appendChild(b);
      });
      wrap.appendChild(block);
    });
    // Se período selecionado é mensal, default para Q1
    if (['JUL','AGO','SET'].includes(selectedPeriod)) {
      selectedPeriod = 'Q1';
      buildPeriodOptions();
    }
  }
}

document.querySelectorAll('.mode-tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.mode-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    periodMode = t.dataset.mode;
    buildPeriodOptions();
    render();
  };
});

// ── Render ───────────────────────────────────────────────────
function render() {
  if (!DATA || !selectedRegua) return;
  const regua = DATA.reguas.find(r => r.id === selectedRegua);
  if (!regua) return;

  const info = FUNIL[regua.id] || { nome: regua.nome_curto, funil: 'A mapear', status: 'ativo' };
  const p = regua.periodos[selectedPeriod];
  const ca = document.getElementById('content-area');
  let html = '';

  // Cabeçalho da régua
  html += '<div style="margin-bottom:16px">' +
    '<h2 style="font-size:1.05rem;font-weight:700;display:flex;align-items:center;flex-wrap:wrap;gap:6px">' +
      info.nome +
      ' <span style="color:var(--muted);font-weight:400;font-size:.82rem">/ ' + regua.id + '</span>' +
      '<span class="funil-badge">' + info.funil + '</span>' +
    '</h2>' +
    '<div style="font-size:.75rem;color:var(--muted);margin-top:4px">' +
      getPeriodLabel(selectedPeriod) +
      (info.funil === 'A mapear' ? ' · <span style="color:#c07000">⚠ Etapa de funil pendente de confirmação no inventário TEC</span>' : '') +
    '</div>' +
  '</div>';

  if (regua.status === 'parcial') {
    html += '<div class="partial-notice">⚠ Régua com coleta parcial — ' + (regua.obs || 'alguns períodos indisponíveis') + '</div>';
  }

  if (!p) {
    html += '<p class="no-data">Dados não disponíveis para este período.</p>';
    ca.innerHTML = html;
    return;
  }

  // KPI cards
  const txConv = p.leads > 0 ? (p.conv_total / p.leads * 100).toFixed(2) : '0.00';
  html += '<div class="kpi-row">' +
    kpiCard('c-blue',  'Leads (Entered)', fmt(p.leads), '') +
    kpiCard('',        'Enviados',        fmt(p.enviados), 'Entregues: ' + fmt(p.entregues) + ' (' + fmtPct(p.tx_entrega) + ')') +
    kpiCard('c-green', 'Conversões',      fmt(p.conv_total), 'Tx. ' + txConv + '% sobre leads') +
    kpiCard('c-amber', 'Receita Estimada', fmtR(p.receita), 'TM: R$ 214,00') +
  '</div>';

  // Canais
  const canais = [];
  if (p.email)    canais.push({ id:'email',   label:'E-mail',   color: CANAL_COLORS.email,   cls:'ctag-email', d: p.email });
  if (p.whatsapp) canais.push({ id:'wa',      label:'WhatsApp', color: CANAL_COLORS.wa,      cls:'ctag-wa',    d: p.whatsapp });
  if (p.sms)      canais.push({ id:'sms',     label:'SMS',      color: CANAL_COLORS.sms,     cls:'ctag-sms',   d: p.sms });
  if (p.webpush)  canais.push({ id:'webpush', label:'Web Push', color: CANAL_COLORS.webpush, cls:'ctag-wp',    d: p.webpush });

  // Tabela por canal
  html += '<div class="section-title">Performance por Canal</div>';
  html += '<div class="table-wrap"><table><thead><tr>' +
    '<th>Canal</th><th>Enviados</th><th>Entregues</th><th>Tx. Entrega</th>' +
    '<th>Aberturas</th><th>Tx. Abertura</th><th>Cliques</th><th>CTOR</th><th>Conversões</th>' +
    '</tr></thead><tbody>';

  canais.forEach(c => {
    const d = c.d;
    html += '<tr>' +
      '<td><span class="ctag ' + c.cls + '"><span class="cdot" style="background:' + c.color + '"></span>' + c.label + '</span></td>' +
      '<td>' + fmt(d.enviados) + '</td>' +
      '<td>' + fmt(d.entregues) + '</td>' +
      '<td>' + fmtPct(d.tx_entrega) + '</td>' +
      '<td>' + (d.opens != null ? fmt(d.opens) : '<span class="no-data">n/a</span>') + '</td>' +
      '<td>' + (d.tx_abertura != null ? fmtPct(d.tx_abertura) : '<span class="no-data">n/a</span>') + '</td>' +
      '<td>' + fmt(d.clicks) + '</td>' +
      '<td>' + (d.ctor != null ? fmtPct(d.ctor) : '<span class="no-data">—</span>') + '</td>' +
      '<td><strong>' + fmt(d.conv) + '</strong></td>' +
    '</tr>';
  });
  if (!canais.length) html += '<tr><td colspan="9" class="no-data" style="padding:14px">Sem dados de canais neste período.</td></tr>';
  html += '</tbody></table></div>';

  // Gráficos
  html += '<div class="charts-row">' +
    '<div class="chart-card"><h4>Enviados por Canal</h4><canvas id="chart-env" height="180"></canvas></div>' +
    '<div class="chart-card"><h4>Conversões por Canal</h4><canvas id="chart-conv" height="180"></canvas></div>' +
  '</div>';

  // Tabela de evolução
  html += '<div class="section-title">Evolução do Período</div>';
  html += buildEvolutionTable(regua);

  ca.innerHTML = html;
  renderCharts(canais);
}

function kpiCard(cls, label, val, sub) {
  return '<div class="kpi-card ' + cls + '">' +
    '<div class="kpi-label">' + label + '</div>' +
    '<div class="kpi-val">' + val + '</div>' +
    (sub ? '<div class="kpi-sub">' + sub + '</div>' : '') +
  '</div>';
}

function getPeriodLabel(pid) {
  const labels = {
    Q1:'Q1 — 01/07 a 15/07/2026', Q2:'Q2 — 16/07 a 31/07/2026',
    Q3:'Q3 — 01/08 a 15/08/2026', Q4:'Q4 — 16/08 a 31/08/2026',
    Q5:'Q5 — 01/09 a 02/09/2026 (parcial)',
    JUL:'Julho 2026 (Q1+Q2)', AGO:'Agosto 2026 (Q3+Q4)',
    SET:'Setembro 2026 — parcial (apenas Q5)'
  };
  return labels[pid] || pid;
}

function buildEvolutionTable(regua) {
  const qCols  = ['Q1','Q2','Q3','Q4','Q5'];
  const qHdrs  = ['Q1 Jul','Q2 Jul','Q3 Ago','Q4 Ago','Q5 Set'];
  const mCols  = ['JUL','AGO','SET'];
  const mHdrs  = ['Julho','Agosto','Setembro'];
  const rows   = [
    { label:'Leads',       fn: d => fmt(d.leads) },
    { label:'Enviados',    fn: d => fmt(d.enviados) },
    { label:'Entregues',   fn: d => fmt(d.entregues) },
    { label:'Conversões',  fn: d => fmt(d.conv_total) },
    { label:'Receita',     fn: d => fmtR(d.receita) },
  ];
  let h = '<div class="table-wrap"><table><thead><tr><th>Métrica</th>';
  qHdrs.forEach(l => h += '<th>' + l + '</th>');
  mHdrs.forEach(l => h += '<th class="month-header-col">' + l + '</th>');
  h += '</tr></thead><tbody>';
  rows.forEach(row => {
    h += '<tr><td style="font-weight:600">' + row.label + '</td>';
    qCols.forEach(q => {
      const p = regua.periodos[q];
      h += '<td>' + (p ? row.fn(p) : '<span class="no-data">—</span>') + '</td>';
    });
    mCols.forEach(q => {
      const p = regua.periodos[q];
      h += '<td class="month-header-col">' + (p ? row.fn(p) : '<span class="no-data">—</span>') + '</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

// ── Gráficos ─────────────────────────────────────────────────
let chartEnv = null, chartConv = null;
function renderCharts(canais) {
  if (chartEnv)  { chartEnv.destroy();  chartEnv  = null; }
  if (chartConv) { chartConv.destroy(); chartConv = null; }
  if (!canais.length) return;

  const labels   = canais.map(c => c.label);
  const hexColors = canais.map(c => c.color);   // hex direto, não CSS var
  const envData  = canais.map(c => c.d.enviados || 0);
  const convData = canais.map(c => c.d.conv || 0);

  const base = {
    responsive: true, maintainAspectRatio: true,
    plugins: { legend: { display: false } },
    scales: { y: { beginAtZero:true }, x: {} }
  };

  chartEnv = new Chart(document.getElementById('chart-env'), {
    type:'bar',
    data:{ labels, datasets:[{ data:envData, backgroundColor:hexColors, borderRadius:6 }] },
    options: base
  });

  chartConv = new Chart(document.getElementById('chart-conv'), {
    type:'bar',
    data:{ labels, datasets:[{ data:convData, backgroundColor:hexColors, borderRadius:6 }] },
    options:{ ...base, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } } }
  });
}

// ── Boot ─────────────────────────────────────────────────────
loadData();
</script>
