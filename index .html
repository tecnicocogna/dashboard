<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Multiprodutos Réguas Técnico | Anhanguera</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --primary:#1e3a5f; --bg:#f4f6fa; --card:#fff; --border:#dee2e8;
    --text:#1a2337; --muted:#6c757d;
    --email:#4361ee; --wa:#25d366; --sms:#f4a261; --wp:#e63946;
    --teal:#0096b2; --green:#2a9d8f; --amber:#c9a227;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text)}

  /* Header */
  .hdr{background:var(--primary);color:#fff;padding:13px 24px;display:flex;align-items:center;gap:14px}
  .hdr img{height:34px}
  .hdr-div{width:1px;height:30px;background:rgba(255,255,255,.25)}
  .hdr h1{font-size:1.05rem;font-weight:700}
  .hdr .sub{font-size:.73rem;opacity:.65;margin-top:2px}

  /* Layout */
  .layout{display:flex;min-height:calc(100vh - 62px)}
  .sidebar{width:228px;background:#fff;border-right:1px solid var(--border);padding:10px 0;flex-shrink:0}
  .main{flex:1;padding:20px 24px;overflow-x:auto}

  /* Sidebar */
  .s-lbl{padding:8px 14px 3px;font-size:.67rem;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}
  .s-item{padding:9px 14px;cursor:pointer;border-left:3px solid transparent;transition:background .12s}
  .s-item:hover{background:var(--bg)}
  .s-item.active{background:#e8effe;border-left-color:var(--teal)}
  .s-name{font-size:.81rem;font-weight:600}
  .s-item.active .s-name{color:var(--primary)}
  .s-id{font-size:.68rem;color:var(--muted);margin-top:1px}
  .s-tags{margin-top:4px;display:flex;gap:4px;flex-wrap:wrap}
  .stag{border-radius:3px;padding:1px 6px;font-size:.64rem;font-weight:700;display:inline-block}
  .st-ativo{background:#d4edda;color:#1a6b35}
  .st-passivo{background:#f8f9fa;color:#6c757d;border:1px solid #dee2e8}
  .st-sunset{background:#fde8e8;color:#a02020}
  .st-parcial{background:#fff3cd;color:#7d5a00}
  .st-funil{background:#e8f4ff;color:#1a5fa0}

  /* Period selector */
  .period-sel{margin-bottom:18px}
  .mode-tabs{display:flex;background:#fff;border:1px solid var(--border);border-radius:7px;width:fit-content;overflow:hidden;margin-bottom:10px}
  .mode-tab{padding:6px 18px;border:none;cursor:pointer;font-size:.81rem;font-weight:600;background:transparent;color:var(--muted);transition:all .13s}
  .mode-tab.active{background:var(--primary);color:#fff}
  .period-opts{display:flex;gap:10px;flex-wrap:wrap}
  .pgrp{background:#fff;border:1px solid var(--border);border-radius:7px;overflow:hidden}
  .pgrp-hdr{background:#f0f2f7;padding:3px 12px;font-size:.67rem;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
  .pgrp-btns{display:flex}
  .pbtn{padding:7px 13px;border:none;cursor:pointer;font-size:.8rem;background:transparent;color:var(--muted);font-weight:500;transition:all .13s;border-top:2px solid transparent}
  .pbtn:hover{background:var(--bg);color:var(--text)}
  .pbtn.active{color:var(--primary);font-weight:700;border-top-color:var(--primary);background:#f0f5ff}

  /* KPI Cards */
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:var(--card);border-radius:9px;padding:14px 15px;border:1px solid var(--border);position:relative;overflow:hidden}
  .kpi::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:#e63946}
  .kpi.c1::before{background:var(--teal)} .kpi.c2::before{background:var(--green)} .kpi.c3::before{background:var(--amber)}
  .kpi-lbl{font-size:.67rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .kpi-val{font-size:1.5rem;font-weight:700;line-height:1.1}
  .kpi-sub{font-size:.71rem;color:var(--muted);margin-top:3px}

  /* Section title */
  .sec{font-size:.8rem;font-weight:700;color:var(--primary);margin-bottom:9px;display:flex;align-items:center;gap:8px}
  .sec::after{content:'';flex:1;height:1px;background:var(--border)}

  /* Tables */
  .tbl-wrap{background:var(--card);border-radius:9px;border:1px solid var(--border);overflow:hidden;margin-bottom:18px}
  table{width:100%;border-collapse:collapse;font-size:.81rem}
  thead th{background:#f8f9fc;padding:8px 12px;text-align:left;font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--border)}
  tbody td{padding:8px 12px;border-bottom:1px solid #f0f2f5}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:#f8fafc}
  .ctag{display:inline-flex;align-items:center;gap:5px;border-radius:4px;padding:2px 7px;font-size:.7rem;font-weight:700}
  .ct-e{background:#dde8ff;color:#2b45c8}.ct-w{background:#d1f5e0;color:#1a6b35}.ct-s{background:#fde8d5;color:#9a4010}.ct-p{background:#fde8e8;color:#a02020}
  .cdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
  .mth{background:#f0f3fa!important;font-weight:700!important;color:var(--primary)!important;font-size:.73rem!important}

  /* Charts */
  .charts-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
  .chart-card{background:var(--card);border-radius:9px;border:1px solid var(--border);padding:15px}
  .chart-card h4{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}

  .warn{background:#fff8e1;border:1px solid #f0c040;border-radius:7px;padding:8px 13px;font-size:.79rem;color:#7d5a00;margin-bottom:13px}
  .nd{color:var(--muted);font-style:italic;font-size:.82rem}
  .funil-badge{display:inline-block;background:#e8f4ff;color:#1a5fa0;border-radius:4px;padding:2px 8px;font-size:.7rem;font-weight:600;margin-left:6px;vertical-align:middle}

  @media(max-width:768px){
    .layout{flex-direction:column}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border)}
    .charts-row{grid-template-columns:1fr}
    .main{padding:14px}
  }
</style>
</head>

// ── INVENTÁRIO DE FUNIL ──────────────────────────────────────
const FUNIL={
  '3511':{nome:'Semi Inscrito TEC',funil:'Semi Inscrito',status:'ativo'},
  '3704':{nome:'Semi Inscrito TEC v2',funil:'Semi Inscrito',status:'ativo'},
  '3554':{nome:'Inscrito TEC — SMS',funil:'Inscrito',status:'ativo'},
  '3878':{nome:'Inscrito TEC — Multicanal',funil:'Inscrito',status:'ativo'},
  '3900':{nome:'Aprovado TEC',funil:'Aprovado',status:'ativo'},
  '3901':{nome:'Aprovado TEC — Multicanal',funil:'Aprovado',status:'ativo'},
  '3935':{nome:'Inscrito TEC — Massa',funil:'Inscrito',status:'ativo'},
  '3943':{nome:'Inscrito TEC — Seg.',funil:'Inscrito',status:'ativo'},
  '3951':{nome:'Inscrito TEC — Coorte',funil:'Inscrito',status:'parcial'}
};
const CC={email:'#4361ee',wa:'#25d366',sms:'#f4a261',webpush:'#e63946'};

// ── ESTADO ────────────────────────────────────────────────────
let selReg=null, selPer='JUL', mode='mensal';

// ── FORMATADORES ─────────────────────────────────────────────
const fmt=n=>n==null?'—':n.toLocaleString('pt-BR');
const pct=n=>n==null?'—':n.toFixed(2)+'%';
const brl=n=>n==null?'—':'R$\u202f'+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

// ── INIT ──────────────────────────────────────────────────────
(function init(){
  const m=DATA.meta;
  document.getElementById('hdr-meta').textContent=
    m.conta+' · '+m.segmento+' · '+m.total_reguas+' réguas · Gerado em '+m.gerado_em;
  buildSidebar();
  buildPeriods();
  if(DATA.reguas.length) selReg=DATA.reguas[0].id, mark(), render();
})();

// ── SIDEBAR ───────────────────────────────────────────────────
function buildSidebar(){
  const el=document.getElementById('reg-list');
  el.innerHTML='';
  DATA.reguas.forEach(r=>{
    const inf=FUNIL[r.id]||{nome:r.nome_curto,funil:'A mapear',status:'ativo'};
    const d=document.createElement('div');
    d.className='s-item'; d.dataset.id=r.id;
    d.innerHTML=
      '<div class="s-name">'+inf.nome+'</div>'+
      '<div class="s-id">'+r.id+'</div>'+
      '<div class="s-tags">'+stag(inf.status)+
        '<span class="stag st-funil">'+inf.funil+'</span></div>';
    d.onclick=()=>{selReg=r.id;mark();render();};
    el.appendChild(d);
  });
}
function stag(s){
  const m={ativo:'st-ativo',passivo:'st-passivo',sunset:'st-sunset',parcial:'st-parcial'};
  const l={ativo:'Ativo',passivo:'Passivo',sunset:'Sunset',parcial:'Parcial'};
  return '<span class="stag '+(m[s]||'st-passivo')+'">'+(l[s]||s)+'</span>';
}
function mark(){
  document.querySelectorAll('.s-item').forEach(e=>e.classList.toggle('active',e.dataset.id===selReg));
}

// ── PERÍODOS ──────────────────────────────────────────────────
const MENSAL=[{id:'JUL',lbl:'Julho 2026'},{id:'AGO',lbl:'Agosto 2026'},{id:'SET',lbl:'Set (parcial)'}];
const QUINZENAL=[
  {grp:'Julho',  itens:[{id:'Q1',lbl:'Q1 01–15/07'},{id:'Q2',lbl:'Q2 16–31/07'}]},
  {grp:'Agosto', itens:[{id:'Q3',lbl:'Q3 01–15/08'},{id:'Q4',lbl:'Q4 16–31/08'}]},
  {grp:'Set',    itens:[{id:'Q5',lbl:'Q5 01–02/09 ⚠'}]}
];

function buildPeriods(){
  const w=document.getElementById('period-opts');
  w.innerHTML='';
  if(mode==='mensal'){
    // Se período atual é quinzenal, volta pra JUL
    if(['Q1','Q2','Q3','Q4','Q5'].includes(selPer)) selPer='JUL';
    const b=document.createElement('div');
    b.className='pgrp';
    b.innerHTML='<div class="pgrp-hdr">Mês</div><div class="pgrp-btns" id="m-btns"></div>';
    w.appendChild(b);
    MENSAL.forEach(p=>{
      const btn=document.createElement('button');
      btn.className='pbtn'+(selPer===p.id?' active':'');
      btn.textContent=p.lbl;
      btn.onclick=()=>{selPer=p.id;buildPeriods();render();};
      document.getElementById('m-btns').appendChild(btn);
    });
  } else {
    if(['JUL','AGO','SET'].includes(selPer)) selPer='Q1';
    QUINZENAL.forEach(g=>{
      const b=document.createElement('div');
      b.className='pgrp';
      b.innerHTML='<div class="pgrp-hdr">'+g.grp+'</div><div class="pgrp-btns"></div>';
      const btns=b.querySelector('.pgrp-btns');
      g.itens.forEach(p=>{
        const btn=document.createElement('button');
        btn.className='pbtn'+(selPer===p.id?' active':'');
        btn.textContent=p.lbl;
        btn.onclick=()=>{selPer=p.id;buildPeriods();render();};
        btns.appendChild(btn);
      });
      w.appendChild(b);
    });
  }
}
document.querySelectorAll('.mode-tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.mode-tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); mode=t.dataset.mode; buildPeriods(); render();
});

// ── RENDER ────────────────────────────────────────────────────
let cEnv=null, cCon=null;
function render(){
  if(!selReg) return;
  const reg=DATA.reguas.find(r=>r.id===selReg);
  if(!reg) return;
  const inf=FUNIL[reg.id]||{nome:reg.nome_curto,funil:'A mapear',status:'ativo'};
  const p=reg.periodos[selPer];
  const ca=document.getElementById('content');
  let h='';

  // Cabeçalho
  const pLbl={Q1:'Q1 01/07–15/07',Q2:'Q2 16/07–31/07',Q3:'Q3 01/08–15/08',
               Q4:'Q4 16/08–31/08',Q5:'Q5 01/09–02/09 (parcial)',
               JUL:'Julho 2026 (Q1+Q2)',AGO:'Agosto 2026 (Q3+Q4)',SET:'Set 2026 (Q5)'}[selPer]||selPer;
  h+='<div style="margin-bottom:15px">'+
    '<h2 style="font-size:1rem;font-weight:700;display:flex;align-items:center;flex-wrap:wrap;gap:6px">'+
      inf.nome+
      ' <span style="color:var(--muted);font-weight:400;font-size:.8rem">/ '+reg.id+'</span>'+
      '<span class="funil-badge">'+inf.funil+'</span>'+
    '</h2>'+
    '<div style="font-size:.73rem;color:var(--muted);margin-top:3px">'+pLbl+'</div>'+
  '</div>';

  if(reg.status==='parcial')
    h+='<div class="warn">⚠ Régua com coleta parcial — '+(reg.obs||'alguns períodos indisponíveis')+'</div>';

  if(!p){
    h+='<p class="nd">Dados não disponíveis para este período.</p>';
    ca.innerHTML=h; return;
  }

  // KPIs
  const tc=p.leads>0?(p.conv_total/p.leads*100).toFixed(2):'0.00';
  h+='<div class="kpi-row">'+
    card('c1','Leads (Entered)',fmt(p.leads),'')+
    card('','Enviados',fmt(p.enviados),'Entregues: '+fmt(p.entregues)+' ('+pct(p.tx_entrega)+')')+
    card('c2','Conversões',fmt(p.conv_total),'Tx. '+tc+'% sobre leads')+
    card('c3','Receita Estimada',brl(p.receita),'TM: R$ 214,00')+
  '</div>';

  // Canais
  const cs=[];
  if(p.email)    cs.push({id:'email',  lbl:'E-mail',  clr:CC.email,   cls:'ct-e',d:p.email});
  if(p.whatsapp) cs.push({id:'wa',     lbl:'WhatsApp',clr:CC.wa,      cls:'ct-w',d:p.whatsapp});
  if(p.sms)      cs.push({id:'sms',    lbl:'SMS',     clr:CC.sms,     cls:'ct-s',d:p.sms});
  if(p.webpush)  cs.push({id:'webpush',lbl:'Web Push',clr:CC.webpush, cls:'ct-p',d:p.webpush});

  h+='<div class="sec">Performance por Canal</div>';
  h+='<div class="tbl-wrap"><table><thead><tr>'+
    '<th>Canal</th><th>Enviados</th><th>Entregues</th><th>Tx.Entrega</th>'+
    '<th>Aberturas</th><th>Tx.Abertura</th><th>Cliques</th><th>CTOR</th><th>Conv.</th>'+
  '</tr></thead><tbody>';
  cs.forEach(c=>{
    const d=c.d;
    h+='<tr>'+
      '<td><span class="ctag '+c.cls+'"><span class="cdot" style="background:'+c.clr+'"></span>'+c.lbl+'</span></td>'+
      '<td>'+fmt(d.enviados)+'</td><td>'+fmt(d.entregues)+'</td><td>'+pct(d.tx_entrega)+'</td>'+
      '<td>'+(d.opens!=null?fmt(d.opens):'<span class="nd">n/a</span>')+'</td>'+
      '<td>'+(d.tx_abertura!=null?pct(d.tx_abertura):'<span class="nd">n/a</span>')+'</td>'+
      '<td>'+fmt(d.clicks)+'</td>'+
      '<td>'+(d.ctor!=null?pct(d.ctor):'<span class="nd">—</span>')+'</td>'+
      '<td><strong>'+fmt(d.conv)+'</strong></td>'+
    '</tr>';
  });
  if(!cs.length) h+='<tr><td colspan="9" class="nd" style="padding:12px">Sem dados de canais.</td></tr>';
  h+='</tbody></table></div>';

  // Gráficos
  h+='<div class="charts-row">'+
    '<div class="chart-card"><h4>Enviados por Canal</h4><canvas id="ce" height="180"></canvas></div>'+
    '<div class="chart-card"><h4>Conversões por Canal</h4><canvas id="cc" height="180"></canvas></div>'+
  '</div>';

  // Tabela evolução
  h+='<div class="sec">Evolução do Período</div>';
  h+=evoTable(reg);

  ca.innerHTML=h;

  // Destruir charts antigos
  if(cEnv){cEnv.destroy();cEnv=null;}
  if(cCon){cCon.destroy();cCon=null;}
  if(!cs.length) return;

  const lbls=cs.map(c=>c.lbl);
  const clrs=cs.map(c=>c.clr);
  const base={responsive:true,maintainAspectRatio:true,
    plugins:{legend:{display:false}},
    scales:{y:{beginAtZero:true},x:{}}};

  cEnv=new Chart(document.getElementById('ce'),{
    type:'bar',
    data:{labels:lbls,datasets:[{data:cs.map(c=>c.d.enviados||0),backgroundColor:clrs,borderRadius:5}]},
    options:base
  });
  cCon=new Chart(document.getElementById('cc'),{
    type:'bar',
    data:{labels:lbls,datasets:[{data:cs.map(c=>c.d.conv||0),backgroundColor:clrs,borderRadius:5}]},
    options:{...base,scales:{y:{beginAtZero:true,ticks:{precision:0}},x:{}}}
  });
}

function card(cls,lbl,val,sub){
  return '<div class="kpi '+cls+'">'+
    '<div class="kpi-lbl">'+lbl+'</div>'+
    '<div class="kpi-val">'+val+'</div>'+
    (sub?'<div class="kpi-sub">'+sub+'</div>':'')+
  '</div>';
}

function evoTable(reg){
  const qc=['Q1','Q2','Q3','Q4','Q5'],qh=['Q1 Jul','Q2 Jul','Q3 Ago','Q4 Ago','Q5 Set'];
  const mc=['JUL','AGO','SET'],mh=['Julho','Agosto','Set'];
  const rows=[
    {lbl:'Leads',      fn:d=>fmt(d.leads)},
    {lbl:'Enviados',   fn:d=>fmt(d.enviados)},
    {lbl:'Entregues',  fn:d=>fmt(d.entregues)},
    {lbl:'Conversões', fn:d=>fmt(d.conv_total)},
    {lbl:'Receita',    fn:d=>brl(d.receita)}
  ];
  let h='<div class="tbl-wrap"><table><thead><tr><th>Métrica</th>';
  qh.forEach(l=>h+='<th>'+l+'</th>');
  mh.forEach(l=>h+='<th class="mth">'+l+'</th>');
  h+='</tr></thead><tbody>';
  rows.forEach(row=>{
    h+='<tr><td style="font-weight:600">'+row.lbl+'</td>';
    qc.forEach(q=>{const p=reg.periodos[q];h+='<td>'+(p?row.fn(p):'<span class="nd">—</span>')+'</td>';});
    mc.forEach(q=>{const p=reg.periodos[q];h+='<td class="mth">'+(p?row.fn(p):'<span class="nd">—</span>')+'</td>';});
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
}
